<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: station-join.webp</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7f7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <div class="r-header region chrome" data-region="header"><!-- floating enamel-blue header bar --></div>
  <div class="r-link-mail region control" data-region="link-mail"><!-- header link דוא״ל: rebuild the control's chrome from the crop (comp-spec.mjs --crop link-mail); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-link-whatsapp region control" data-region="link-whatsapp"><!-- header link וואטסאפ: rebuild the control's chrome from the crop (comp-spec.mjs --crop link-whatsapp); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-link-x region control" data-region="link-x"><!-- header link X: rebuild the control's chrome from the crop (comp-spec.mjs --crop link-x); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-logo-card region chrome" data-region="logo-card"><!-- white rounded plate holding the logo --></div>
  <figure class="r-logo region plate" data-region="logo"><img src="../../../assets/plates/logo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-rail region chrome" data-region="rail"><!-- white side route card --></div>
  <div class="r-stop-home region control" data-region="stop-home"><!-- stop הבית: rebuild the control's chrome from the crop (comp-spec.mjs --crop stop-home); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stop-about region control" data-region="stop-about"><!-- stop מי אנחנו: rebuild the control's chrome from the crop (comp-spec.mjs --crop stop-about); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stop-vision region control" data-region="stop-vision"><!-- stop החזון: rebuild the control's chrome from the crop (comp-spec.mjs --crop stop-vision); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stop-join region control" data-region="stop-join"><!-- stop הצטרפות in orange: rebuild the control's chrome from the crop (comp-spec.mjs --crop stop-join); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-stop-contact region control" data-region="stop-contact"><!-- stop קשר: rebuild the control's chrome from the crop (comp-spec.mjs --crop stop-contact); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-about-sheet region chrome" data-region="about-sheet"><!-- tall blue sheet --></div>
  <div class="r-about-title region text" data-region="about-title"><!-- white headline זה עלינו on the blue sheet --><p style="font-size:var(--r-about-title-font);line-height:1.05;margin:0">about-title</p></div>
  <div class="r-about-body region text" data-region="about-body"><!-- white civic sentence on the blue sheet --><p style="font-size:var(--r-about-body-font);line-height:1.05;margin:0">about-body</p></div>
  <div class="r-join-sheet region chrome" data-region="join-sheet"><!-- large orange join sheet --></div>
  <div class="r-join-title region text" data-region="join-title"><!-- white headline הצטרפו לתנועה --><p style="font-size:var(--r-join-title-font);font-family:var(--r-join-title-family),sans-serif;font-weight:var(--r-join-title-weight);line-height:1.05;margin:0">join-title</p></div>
  <div class="r-join-sub region text" data-region="join-sub"><!-- smaller white line קהילת הוואטסאפ --><p style="line-height:1.05;margin:0">join-sub</p></div>
  <div class="r-email-sheet region chrome" data-region="email-sheet"><!-- white email sheet --></div>
  <div class="r-email-text region text" data-region="email-text"><!-- zealenu@gmail.com --><p style="font-size:var(--r-email-text-font);line-height:1.05;margin:0">email-text</p></div>
  <div class="r-x-sheet region chrome" data-region="x-sheet"><!-- white X sheet --></div>
  <div class="r-x-text region text" data-region="x-text"><!-- @ZeAlenu --><p style="font-size:var(--r-x-text-font);line-height:1.05;margin:0">x-text</p></div>
  <div class="r-line-sheet region chrome" data-region="line-sheet"><!-- white sheet for the line --></div>
  <div class="r-line-text region text" data-region="line-text"><!-- blue line בונים תקומה ציונית --><p style="line-height:1.05;margin:0">line-text</p></div>
</main>
</body>
</html>
