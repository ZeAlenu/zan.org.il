name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "main ${GITHUB_SHA}"
      - name: Post-deploy smoke (canary only, no auto-rollback)
        run: |
          expected=$(grep -oP '(?<=<title>)[^<]+' dist/client/index.html | head -1)
          test -n "$expected"
          for url in https://zan.org.il/ https://www.zan.org.il/; do
            ok=0
            for i in 1 2 3 4 5 6; do
              code=$(curl -sS -o body.html -w '%{http_code}' -L "$url" || true)
              if [ "$code" = 200 ] && grep -qF "$expected" body.html; then ok=1; break; fi
              echo "$url attempt $i: HTTP $code"; sleep 10
            done
            [ "$ok" = 1 ] || { echo "::error::Smoke failed for $url (rollback manually: wrangler rollback via Actions)"; exit 1; }
            echo "$url OK"
          done
