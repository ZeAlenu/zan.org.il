name: E2E on PR preview

# pull_request runs this file from the head branch, including on the pull request
# that adds it. The workers.dev host is not in the Workers Builds check. It is the
# deployment URL on the cloudflare-workers-and-pages comment row for the head SHA.
# e2e/preview-url.ts polls that comment for about ten minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: e2e-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: url
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node --experimental-strip-types e2e/preview-url.ts
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
          E2E_BASE_URL: ${{ steps.url.outputs.url }}
          E2E_START_SERVER: "0"
