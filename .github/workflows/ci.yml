name: Build

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: "true"
          E2E_BASE_URL: http://127.0.0.1:4321
          E2E_START_SERVER: "1"
          WRANGLER_SEND_METRICS: "false"

  namecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: namecheck
        env:
          ZAN_REALNAMES: ${{ secrets.ZAN_REALNAMES }}
        run: |
          set -euo pipefail
          if [ -z "${ZAN_REALNAMES}" ]; then
            echo "namecheck: name list missing" >&2
            exit 1
          fi
          umask 077
          list=$(mktemp)
          trap 'rm -f "$list"' EXIT
          printf '%s\n' "$ZAN_REALNAMES" > "$list"
          python3 namecheck.py "$list"
